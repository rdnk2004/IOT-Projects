{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TempSync Monitor</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{% static 'dashboard/css/styles.css' %}">
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-temperature-half fa-3x" style="color: #58a6ff; margin-bottom: 1rem;"></i>
            <h2>TempSync Login</h2>
            <p>Access the IoT temperature monitoring dashboard</p>
        </div>
        
        {% if error_message %}
        <div class="auth-alert">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error_message }}</span>
        </div>
        {% endif %}
        
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter admin username"
                    required 
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter password"
                    required 
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-auth">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--text-secondary);">
            Default credentials: <span style="color: var(--text-primary); font-weight: 600;">admin</span> / <span style="color: var(--text-primary); font-weight: 600;">admin123</span>
        </div>
    </div>
</body>
</html>
